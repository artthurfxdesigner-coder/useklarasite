<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Blusas — Use Klara</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div id="site-header" data-active="cat"></div>

<section class="pagehead">
  <div class="container">
    <h1 class="pagehead__title">Blusas</h1>
    <nav class="crumb"><a href="index.html">Início</a><span>/</span><a href="vestidos.html">Categorias</a><span>/</span><span class="is-current">Blusas</span></nav>
  </div>
</section>

<section class="listing">
  <div class="container listing__grid">

    <aside class="filters">
      <h3>Filtros</h3>
      <div class="filter">
        <h4>Categoria</h4>
        <label><input type="checkbox"> Vestidos <span class="qt">(12)</span></label>
        <label><input type="checkbox"> Macacão <span class="qt">(9)</span></label>
        <label><input type="checkbox" checked> Blusas <span class="qt">(14)</span></label>
        <label><input type="checkbox"> Calças <span class="qt">(8)</span></label>
        <label><input type="checkbox"> Saias <span class="qt">(6)</span></label>
      </div>
      <div class="filter">
        <h4>Tamanho</h4>
        <div class="filter__sizes">
          <button>PP</button><button class="is-active">P</button><button>M</button><button>G</button><button>GG</button><button>XGG</button>
        </div>
      </div>
      <div class="filter filter__price">
        <h4>Preço</h4>
        <input type="range" min="50" max="600" value="400">
        <div class="range"><span>R$ 100</span><span>R$ 400</span></div>
      </div>
      <div class="filter">
        <h4>Cor</h4>
        <div class="filter__colors">
          <button class="is-active"><span style="background:#5D412E"></span></button>
          <button><span style="background:#412F23"></span></button>
          <button><span style="background:#9C8674"></span></button>
          <button><span style="background:#CDBAA6"></span></button>
          <button><span style="background:#E0C79B"></span></button>
          <button><span style="background:#3E3E3E"></span></button>
        </div>
      </div>
    </aside>

    <div>
      <div class="listing__toolbar">
        <p class="listing__count">Mostrando 12 de 12 produtos</p>
        <div class="select"><label for="sort">Ordenar por :</label>
          <select id="sort"><option>Mais recentes</option><option>Menor preço</option><option>Maior preço</option><option>Mais vendidos</option></select>
        </div>
      </div>
      <div class="grid grid--4" data-collection="blusas"></div>
      <div class="pagination">
        <button>&lsaquo;</button><button class="is-active">1</button><button>2</button><button>3</button><button>&rsaquo;</button>
      </div>
    </div>

  </div>
</section>

<section class="benefits">
  <div class="container">
    <div class="benefits__grid">
      <div class="benefit reveal"><span class="benefit__icon"><svg viewBox="0 0 24 24" width="26" height="26"><path d="M12 3l8 4v10l-8 4-8-4V7z"/><path d="M4 7l8 4 8-4M12 11v10"/></svg></span><div><h3 class="benefit__title">Frete grátis</h3><p class="benefit__text">Frete grátis para pedidos acima de R$ 250</p></div></div>
      <div class="benefit reveal"><span class="benefit__icon"><svg viewBox="0 0 24 24" width="26" height="26"><rect x="2" y="6" width="20" height="13" rx="2"/><path d="M2 10h20"/><circle cx="17" cy="15" r="1.4"/></svg></span><div><h3 class="benefit__title">Pagamento flexível</h3><p class="benefit__text">Várias opções de pagamento seguro</p></div></div>
      <div class="benefit reveal"><span class="benefit__icon"><svg viewBox="0 0 24 24" width="26" height="26"><path d="M4 14v-2a8 8 0 0 1 16 0v2"/><rect x="2" y="13" width="4" height="6" rx="1.5"/><rect x="18" y="13" width="4" height="6" rx="1.5"/></svg></span><div><h3 class="benefit__title">Suporte 24x7</h3><p class="benefit__text">Atendimento online todos os dias.</p></div></div>
    </div>
  </div>
</section>

<div id="site-footer"></div>
<script src="js/main.js"></script>
</body>
</html>
